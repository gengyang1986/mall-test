components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'jwt.tokenHeader 对应请求头 Authorization，值形如：Bearer {token}'
  parameters:
    bearerToken:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
      description: 'Bearer {token}，由 /sso/login 获取；缺失或过期返回 code=401（HTTP 仍为 200）'
  responses:
    CommonResultResponse:
      description: '统一响应体（HTTP 200，业务码见 code）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommonResult' }
  schemas:
    CommonResult:
      type: object
      description: 通用返回结果封装类
      properties:
        code:
          type: integer
          format: int64
          description: '200 成功；500 操作失败；404 参数检验失败；401 未登录；403 无权限'
          example: 200
        message:
          type: string
          example: 操作成功
        data:
          description: 业务数据，具体类型见各接口 x-data-type
      x-code-enum:
        '200': 操作成功
        '500': 操作失败
        '404': 参数检验失败（业务层常用来表示用户名或密码错误）
        '401': 暂未登录或 token 已经过期
        '403': 没有相关权限
    CommonPage:
      type: object
      description: 分页结果封装，pageNum 从 1 开始（PageHelper 语义）
      properties:
        pageNum: { type: integer }
        pageSize: { type: integer }
        totalPage: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        list: { type: array, items: {} }
    DefaultErrorBody:
      type: object
      description: '未捕获异常时 Spring 默认 /error 结构（HTTP 4xx/5xx，非 CommonResult）'
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        path: { type: string }
    OmsCartItem:
      type: object
      description: 购物车项。add 时后端会用登录态覆盖 memberId，quantity 无数值校验
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productSkuId: { type: integer, format: int64 }
        memberId: { type: integer, format: int64, description: 由后端从登录态注入 }
        quantity: { type: integer, description: 购买数量' }
        price: { type: number, description: 添加到购物车的价格 }
        productPic: { type: string, description: 商品主图 }
        productName: { type: string, description: 商品名称 }
        productSubTitle: { type: string, description: 商品副标题（卖点） }
        productSkuCode: { type: string, description: 商品 sku 条码 }
        memberNickname: { type: string }
        createDate: { type: string, format: date-time }
        modifyDate: { type: string, format: date-time }
        deleteStatus: { type: integer, description: '0 未删除；1 已删除' }
        productCategoryId: { type: integer, format: int64 }
        productBrand: { type: string }
        productSn: { type: string }
        productAttr: { type: string, description: "商品销售属性，JSON 字符串：[{'key':'颜色','value':'红色'}]" }
    UmsMemberReceiveAddress:
      type: object
      description: 会员收货地址
      properties:
        id: { type: integer, format: int64 }
        memberId: { type: integer, format: int64, description: 由后端从登录态注入 }
        name: { type: string, description: 收货人名称 }
        phoneNumber: { type: string }
        defaultStatus: { type: integer, description: '0 非默认；1 默认' }
        postCode: { type: string, description: 邮政编码 }
        province: { type: string, description: 省份/直辖市 }
        city: { type: string, description: 城市 }
        region: { type: string, description: 区 }
        detailAddress: { type: string, description: 详细地址（街道） }
    MemberBrandAttention:
      type: object
      description: 会员品牌关注（MongoDB 文档）
      properties:
        id: { type: string, description: Mongo ObjectId }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberIcon: { type: string }
        brandId: { type: integer, format: int64 }
        brandName: { type: string }
        brandLogo: { type: string }
        brandCity: { type: string }
        createTime: { type: string, format: date-time }
    MemberProductCollection:
      type: object
      description: 会员商品收藏（MongoDB 文档）
      properties:
        id: { type: string, description: Mongo ObjectId }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberIcon: { type: string }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        productPic: { type: string }
        productSubTitle: { type: string }
        productPrice: { type: string, description: 注意是字符串类型 }
        createTime: { type: string, format: date-time }
    MemberReadHistory:
      type: object
      description: 会员商品浏览记录（MongoDB 文档）
      properties:
        id: { type: string, description: Mongo ObjectId }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberIcon: { type: string }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        productPic: { type: string }
        productSubTitle: { type: string }
        productPrice: { type: string }
        createTime: { type: string, format: date-time }
    OrderParam:
      type: object
      description: 生成订单入参
      properties:
        memberReceiveAddressId: { type: integer, format: int64, description: 收货地址 ID；为空时抛「请选择收货地址！」 }
        couponId: { type: integer, format: int64, description: 优惠券 ID；可选 }
        useIntegration: { type: integer, description: 使用的积分数；可选 }
        payType: { type: integer, description: '支付方式：0 未支付；1 支付宝；2 微信' }
        cartIds:
          type: array
          items: { type: integer, format: int64 }
          description: 被选中的购物车商品 ID；可通过 /order/generateConfirmOrder 的 cartPromotionItemList 获取
    AliPayParam:
      type: object
      description: 支付宝支付请求参数（以 query 形式绑定）
      properties:
        outTradeNo: { type: string, description: 商户订单号，需保持唯一 }
        subject: { type: string, description: 订单标题 }
        totalAmount: { type: number, description: 订单总金额（元），精确到小数点后两位 }
    OmsOrderReturnApplyParam:
      type: object
      description: 退货申请入参
      properties:
        orderId: { type: integer, format: int64, description: 订单 id }
        productId: { type: integer, format: int64, description: 退货商品 id }
        orderSn: { type: string, description: 订单编号 }
        memberUsername: { type: string, description: 会员用户名 }
        returnName: { type: string, description: 退货人姓名 }
        returnPhone: { type: string, description: 退货人电话 }
        productPic: { type: string, description: 商品图片 }
        productName: { type: string, description: 商品名称 }
        productBrand: { type: string, description: 商品品牌 }
        productAttr: { type: string, description: '商品销售属性：颜色：红色；尺码：xl' }
        productCount: { type: integer, description: 退货数量 }
        productPrice: { type: number, description: 商品单价 }
        productRealPrice: { type: number, description: 商品实际支付单价 }
        reason: { type: string, description: 原因 }
        description: { type: string, description: 描述 }
        proofPics: { type: string, description: 凭证图片，逗号分隔 }

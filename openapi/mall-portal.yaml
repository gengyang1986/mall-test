openapi: 3.0.3
info:
  title: mall-portal 前台商城服务 API
  version: 1.0.0
  description: |
    mall-portal 前台商城接口规范（OpenAPI 3.0.3）。

    源码依据：mall 仓库 master 分支 mall-portal 模块 13 个 Controller，逐方法核对生成。
    服务地址：http://localhost:8085（application-dev.yml），未配置 context-path。
    鉴权：JWT。请求头 Authorization: Bearer {token}；jwt.tokenHeader=Authorization，jwt.tokenHead='Bearer '，jwt.expiration=604800 秒（7 天），jwt.secret=mall-portal-secret。

    统一响应：CommonResult{code,message,data}，HTTP 状态恒为 200（除未捕获异常）。
    code 取值：200 成功 / 500 操作失败 / 404 参数检验失败 / 401 未登录或 token 过期 / 403 无权限。

    【重要】mall-portal 未配置全局异常处理（mall-portal 内无 @RestControllerAdvice），
    未捕获异常（NPE、SQL 异常、参数类型转换失败等）由 Spring 默认 /error 处理，
    返回 HTTP 4xx/5xx + 默认错误体 {timestamp,status,error,path}，不是 CommonResult。
    断言时必须区分「业务失败（HTTP 200 + code!=200）」与「未捕获异常（HTTP 5xx + 非统一体）」两类。

    安全白名单（application.yml secure.ignored.urls）：/sso/** /home/** /product/** /brand/** /alipay/**。
    其余接口需携带有效 token。白名单内仍有业务约束：/sso/info 未登录时返回 code=401。

    分页语义：本服务使用 PageHelper，pageNum 从 1 开始（与 mall-search 的 Spring Data 0 起语义相反）。
servers:
  - url: http://localhost:8085
    description: 开发环境（dev profile）
tags:
  - name: UmsMemberController
    description: 会员登录注册管理（/sso，白名单）
  - name: HomeController
    description: 首页内容管理（/home，白名单）
  - name: PmsPortalBrandController
    description: 前台品牌管理（/brand，白名单）
  - name: PmsPortalProductController
    description: 前台商品管理（/product，白名单）
  - name: AlipayController
    description: 支付宝支付相关接口（/alipay，白名单）
  - name: OmsCartItemController
    description: 购物车管理（/cart，需登录）
  - name: OmsPortalOrderController
    description: 订单管理（/order，需登录）
  - name: OmsPortalOrderReturnApplyController
    description: 退货申请管理（/returnApply，需登录）
  - name: UmsMemberCouponController
    description: 用户优惠券管理（/member/coupon，需登录）
  - name: UmsMemberReceiveAddressController
    description: 会员收货地址管理（/member/address，需登录）
  - name: MemberAttentionController
    description: 会员关注品牌管理（/member/attention，需登录）
  - name: MemberCollectionController
    description: 会员收藏管理（/member/productCollection，需登录）
  - name: MemberReadHistoryController
    description: 会员商品浏览记录管理（/member/readHistory，需登录）
security:
  - bearerAuth: []
paths:
  /sso/register:
    post:
      tags: [UmsMemberController]
      operationId: memberRegister
      summary: 会员注册
      description: 所有参数均为 @RequestParam 且未声明 required=false，缺失时 Spring 返回 HTTP 400（非 CommonResult）。会员已存在、验证码错误等业务失败走 code=500 + message。
      security: []
      parameters:
        - { name: username, in: query, required: true, schema: { type: string } }
        - { name: password, in: query, required: true, schema: { type: string } }
        - { name: telephone, in: query, required: true, schema: { type: string } }
        - { name: authCode, in: query, required: true, schema: { type: string }, description: 短信验证码，由 /sso/getAuthCode 生成，Redis key ums:authCode，有效期 90 秒 }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'null（成功时 message=注册成功）'
  /sso/login:
    post:
      tags: [UmsMemberController]
      operationId: memberLogin
      summary: 会员登录
      description: |
        成功返回 {token, tokenHead}。
        【反直觉】账号或密码错误时走 CommonResult.validateFailed，code=404（不是 401），message=用户名或密码错误。
      security: []
      parameters:
        - { name: username, in: query, required: true, schema: { type: string } }
        - { name: password, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Map<String,String>{token, tokenHead}'
  /sso/info:
    get:
      tags: [UmsMemberController]
      operationId: memberInfo
      summary: 获取当前登录会员信息
      description: 白名单放行，但 Principal 为 null 时返回 CommonResult.unauthorized(null)，即 code=401。带无效 token 时同样 code=401。
      security: []
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'UmsMember；未登录时 data=null 且 code=401'
  /sso/getAuthCode:
    get:
      tags: [UmsMemberController]
      operationId: getAuthCode
      summary: 获取短信验证码
      description: 【安全风险】直接把验证码明文返回给前端（data 即 authCode），生产环境应改为仅下发短信。
      security: []
      parameters:
        - { name: telephone, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'String（验证码明文）'
  /sso/updatePassword:
    post:
      tags: [UmsMemberController]
      operationId: memberUpdatePassword
      summary: 会员修改密码
      security: []
      parameters:
        - { name: telephone, in: query, required: true, schema: { type: string } }
        - { name: password, in: query, required: true, schema: { type: string } }
        - { name: authCode, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'null（成功时 message=密码修改成功）'
  /sso/refreshToken:
    get:
      tags: [UmsMemberController]
      operationId: refreshToken
      summary: 刷新 token
      description: 直接从请求头读取旧 token；过期返回 CommonResult.failed，code=500、message=token已经过期！；缺失请求头时 message 同为 token已经过期！。
      security: []
      parameters:
        - { name: Authorization, in: header, required: false, schema: { type: string }, description: 'Bearer {token}' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Map<String,String>{token, tokenHead}'
  /home/content:
    get:
      tags: [HomeController]
      operationId: homeContent
      summary: 首页内容信息展示
      security: []
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'HomeContentResult（广告、品牌+商品、分类、人气/新品推荐聚合）'
  /home/recommendProductList:
    get:
      tags: [HomeController]
      operationId: recommendProductList
      summary: 分页获取推荐商品
      description: 返回裸 List，不是 CommonPage。
      security: []
      parameters:
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 4 } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsProduct>'
  '/home/productCateList/{parentId}':
    get:
      tags: [HomeController]
      operationId: homeProductCateList
      summary: 获取首页商品分类
      security: []
      parameters:
        - { name: parentId, in: path, required: true, schema: { type: integer, format: int64 }, description: 0 表示取一级分类 }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsProductCategory>'
  /home/subjectList:
    get:
      tags: [HomeController]
      operationId: homeSubjectList
      summary: 根据分类获取专题
      security: []
      parameters:
        - { name: cateId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 4 } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<CmsSubject>'
  /home/hotProductList:
    get:
      tags: [HomeController]
      operationId: homeHotProductList
      summary: 分页获取人气推荐商品
      security: []
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 6 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsProduct>'
  /home/newProductList:
    get:
      tags: [HomeController]
      operationId: homeNewProductList
      summary: 分页获取新品推荐商品
      security: []
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 6 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsProduct>'
  /brand/recommendList:
    get:
      tags: [PmsPortalBrandController]
      operationId: portalBrandRecommendList
      summary: 分页获取推荐品牌
      description: 返回裸 List，不是 CommonPage。
      security: []
      parameters:
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 6 } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsBrand>'
  '/brand/detail/{brandId}':
    get:
      tags: [PmsPortalBrandController]
      operationId: portalBrandDetail
      summary: 获取品牌详情
      security: []
      parameters:
        - { name: brandId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'PmsBrand；id 不存在时 data=null 但 code=200'
  /brand/productList:
    get:
      tags: [PmsPortalBrandController]
      operationId: portalBrandProductList
      summary: 分页获取品牌相关商品
      security: []
      parameters:
        - { name: brandId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 6 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'CommonPage<PmsProduct>'
  /product/search:
    get:
      tags: [PmsPortalProductController]
      operationId: portalProductSearch
      summary: 综合搜索、筛选、排序
      description: |
        【易错】pageNum 默认值为 0（非 1），而本服务使用 PageHelper，0 起始语义与其他接口不一致，需实测 pageNum=0 的分页行为。
        返回 CommonPage，而同级的 /home/recommendProductList 返回裸 List。
      security: []
      parameters:
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: brandId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: productCategoryId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 5 } }
        - name: sort
          in: query
          required: false
          description: '0 按相关度；1 按新品；2 按销量；3 价格从低到高；4 价格从高到低'
          schema: { type: integer, default: 0, enum: [0, 1, 2, 3, 4] }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'CommonPage<PmsProduct>'
  /product/categoryTreeList:
    get:
      tags: [PmsPortalProductController]
      operationId: portalProductCategoryTreeList
      summary: 以树形结构获取所有商品分类
      security: []
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<PmsProductCategoryNode>'
  '/product/detail/{id}':
    get:
      tags: [PmsPortalProductController]
      operationId: portalProductDetail
      summary: 获取前台商品详情
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'PmsPortalProductDetail（含 skuStockList、productAttributeList、productAttributeValueList）'
  /alipay/pay:
    get:
      tags: [AlipayController]
      operationId: alipayPay
      summary: 支付宝电脑网站支付
      description: 无 @ResponseBody，直接向响应流写入 HTML 表单，Content-Type=text/html。参数为 JavaBean 绑定（query），非 JSON。断言不能用 JSON schema。
      security: []
      parameters:
        - { name: outTradeNo, in: query, required: false, schema: { type: string }, description: 商户订单号 }
        - { name: subject, in: query, required: false, schema: { type: string }, description: 订单标题 }
        - { name: totalAmount, in: query, required: false, schema: { type: number }, description: 订单总金额，元，两位小数 }
      responses:
        '200':
          description: HTML 表单片段
          content:
            text/html:
              schema: { type: string }
  /alipay/webPay:
    get:
      tags: [AlipayController]
      operationId: alipayWebPay
      summary: 支付宝手机网站支付
      description: 同上，Content-Type=text/html。
      security: []
      parameters:
        - { name: outTradeNo, in: query, required: false, schema: { type: string } }
        - { name: subject, in: query, required: false, schema: { type: string } }
        - { name: totalAmount, in: query, required: false, schema: { type: number } }
      responses:
        '200':
          description: HTML 表单片段
          content:
            text/html:
              schema: { type: string }
  /alipay/notify:
    post:
      tags: [AlipayController]
      operationId: alipayNotify
      summary: 支付宝异步回调
      description: 必须 POST，参数从 request.getParameterMap() 读取（form 编码）。返回纯文本 success / failure，不是 CommonResult。
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
              description: 支付宝异步通知全部字段（out_trade_no、trade_no、trade_status、total_amount、sign 等）
      responses:
        '200':
          description: 处理结果
          content:
            text/plain:
              schema: { type: string, enum: [success, failure] }
  /alipay/query:
    get:
      tags: [AlipayController]
      operationId: alipayQuery
      summary: 支付宝统一收单线下交易查询
      description: 【注意】outTradeNo、tradeNo 均未加 @RequestParam，缺失不会 400，而是 null 直接透传给支付宝 SDK。支付成功返回 TRADE_SUCCESS。
      security: []
      parameters:
        - { name: outTradeNo, in: query, required: false, schema: { type: string } }
        - { name: tradeNo, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'String（支付宝交易状态，如 TRADE_SUCCESS）'
  /cart/add:
    post:
      tags: [OmsCartItemController]
      operationId: cartAdd
      summary: 添加商品到购物车
      description: |
        【缺陷候选】add 内对 quantity 无任何校验，quantity=0 或负数会被直接写入数据库。
        同一 productId+productSkuId 已存在时累加 quantity，否则新增。
        memberId 由后端从登录态覆盖，请求体传入的 memberId 不可信。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OmsCartItem' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）；count<=0 时 code=500'
  /cart/list:
    get:
      tags: [OmsCartItemController]
      operationId: cartList
      summary: 获取当前会员的购物车列表
      description: 未登录时 RestAuthenticationEntryPoint 只写 body 不设 HTTP 状态，HTTP 仍为 200，body 为 code=401。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<OmsCartItem>'
  /cart/list/promotion:
    get:
      tags: [OmsCartItemController]
      operationId: cartListPromotion
      summary: 获取当前会员的购物车列表（含促销信息）
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
        - { name: cartIds, in: query, required: false, style: form, explode: true, schema: { type: array, items: { type: integer, format: int64 } }, description: 不传则返回全部购物车商品 }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'List<CartPromotionItem>'
  /cart/update/quantity:
    get:
      tags: [OmsCartItemController]
      operationId: cartUpdateQuantity
      summary: 修改购物车中指定商品的数量
      description: 【设计问题】用 GET 执行写操作，存在被浏览器预取/爬虫误触发的风险。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
        - { name: id, in: query, required: true, schema: { type: integer, format: int64 }, description: 购物车项 id }
        - { name: quantity, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）'
  '/cart/getProduct/{productId}':
    get:
      tags: [OmsCartItemController]
      operationId: cartGetProduct
      summary: 获取购物车中指定商品的规格（用于重选规格）
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'CartProduct（product + skuStockList）'
  /cart/update/attr:
    post:
      tags: [OmsCartItemController]
      operationId: cartUpdateAttr
      summary: 修改购物车中商品的规格
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OmsCartItem' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）'
  /cart/delete:
    post:
      tags: [OmsCartItemController]
      operationId: cartDelete
      summary: 删除购物车中的指定商品
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
        - { name: ids, in: query, required: true, style: form, explode: false, schema: { type: array, items: { type: integer, format: int64 } }, description: 逗号分隔，如 ids=1,2 }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）'
  /cart/clear:
    post:
      tags: [OmsCartItemController]
      operationId: cartClear
      summary: 清空当前会员的购物车
      description: 购物车本来为空时 count=0，返回 code=500（而非幂等成功）。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）'
  /order/generateConfirmOrder:
    post:
      tags: [OmsPortalOrderController]
      operationId: generateConfirmOrder
      summary: 根据购物车信息生成确认单
      description: |
        【易错】请求体是纯 JSON 数组（如 [1,2]），不是 {"cartIds":[...]}。
        【缺陷候选】传空数组时 CollUtil.isNotEmpty(cartIds) 为 false，会退化为返回全部购物车商品的确认单。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, format: int64 }
              description: 购物车项 id 列表
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'ConfirmOrderResult（cartPromotionItemList、memberReceiveAddressList、couponHistoryDetailList、integrationConsumeSetting、calcAmount）'
  /order/generateOrder:
    post:
      tags: [OmsPortalOrderController]
      operationId: generateOrder
      summary: 根据购物车信息生成订单
      description: |
        成功返回 {order, orderItemList} 并 message=下单成功。
        关键校验：先校验收货地址（memberReceiveAddressId 为空抛「请选择收货地址！」），再校验库存（hasStock）、优惠券（getUseCoupon）。
        业务失败统一 code=500 + message（如「库存不足」「优惠券不存在」）。
        【运行期风险】下单成功后会发送 RabbitMQ 延迟取消消息（cancelOrderQueue），MQ 不可用时接口报错但订单已落库，重试会导致重复下单。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderParam' }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Map<String,Object>{order, orderItemList}'
  /order/paySuccess:
    post:
      tags: [OmsPortalOrderController]
      operationId: paySuccess
      summary: 用户支付成功的回调
      description: |
        【缺陷候选】paySuccess 未校验订单当前状态，重复回调会再次扣减 stock、再次累减 lock_stock（幂等缺陷）。
        正常路径：订单 status 0->1，payment_time 写入，扣减 stock 与 lock_stock。
      parameters:
        - { $ref: '#/components/parameters/bearerToken' }
        - { name: orderId, in: query, required: true, schema: { type: integer, format: int64 } }
        - name: payType
          in: query
          required: true
          description: '0 未支付；1 支付宝；2 微信'
          schema: { type: integer, enum: [0, 1, 2] }
      responses:
        '200': { $ref: '#/components/responses/CommonResultResponse' }
      x-data-type: 'Integer（受影响行数）；message=支付成功'

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: 登录接口返回 token，请求头格式 Authorization Bearer 加空格加 token }
  parameters:
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, default: 5 }, description: 每页数量，默认 5 }
    PageNum: { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 }, description: 页码，默认 1 }
    IdPath: { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 主键 id }
    Ids: { name: ids, in: query, required: true, schema: { type: array, items: { type: integer, format: int64 } }, description: 主键 id 数组，形如 ids=1,2 }
  schemas:
    CommonResult:
      type: object
      description: 通用返回封装
      properties:
        code: { type: integer, format: int64, example: 200, description: 200 成功；404 失败；401 未登录；403 未授权 }
        message: { type: string, example: 操作成功 }
        data: { nullable: true, description: 业务数据，具体类型见接口响应的 x-data-type }
      required: [code, message]
    CommonPage:
      type: object
      description: 通用分页封装
      properties:
        pageNum: { type: integer, description: 当前页码 }
        pageSize: { type: integer, description: 每页数量 }
        totalPage: { type: integer, description: 总页数 }
        total: { type: integer, format: int64, description: 总条数 }
        list: { type: array, items: {}, description: 分页数据，元素类型见接口响应 x-data-type }
    UmsAdminParam:
      type: object
      properties: { username: { type: string }, password: { type: string }, icon: { type: string }, email: { type: string }, nickName: { type: string }, note: { type: string } }
      required: [username, password]
    UmsAdminLoginParam:
      type: object
      properties: { username: { type: string }, password: { type: string } }
      required: [username, password]
    UpdateAdminPasswordParam:
      type: object
      properties: { username: { type: string }, oldPassword: { type: string }, newPassword: { type: string } }
      required: [username, oldPassword, newPassword]
    UmsAdmin:
      type: object
      properties: { id: { type: integer, format: int64 }, username: { type: string }, password: { type: string }, icon: { type: string }, email: { type: string }, nickName: { type: string }, note: { type: string }, createTime: { type: string, format: date-time }, loginTime: { type: string, format: date-time }, status: { type: integer, description: '帐号启用状态：0->禁用；1->启用' } }
    UmsRole:
      type: object
      properties: { id: { type: integer, format: int64 }, name: { type: string }, description: { type: string }, adminCount: { type: integer }, createTime: { type: string, format: date-time }, status: { type: integer, description: '启用状态：0->禁用；1->启用' }, sort: { type: integer } }
    UmsMenu:
      type: object
      properties: { id: { type: integer, format: int64 }, parentId: { type: integer, format: int64 }, createTime: { type: string, format: date-time }, title: { type: string }, level: { type: integer }, sort: { type: integer }, name: { type: string }, icon: { type: string }, hidden: { type: integer, description: '前端隐藏：0->显示；1->隐藏' } }
    UmsMenuNode:
      allOf:

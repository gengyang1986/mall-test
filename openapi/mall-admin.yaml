openapi: 3.0.3
info:
  title: Mall 商城后台管理 API（mall-admin）
  version: 1.0.0
  description: |
    基于 mall 仓库 master 分支（dcaa93b）源码静态解析生成，覆盖 mall-admin 的 31 个 Controller。
    服务：mall-admin（Spring Boot，默认端口 8080，未配置 context-path）。
    统一返回封装：CommonResult{code,message,data}，code=200 表示成功；data 为分页时为 CommonPage{pageNum,pageSize,totalPage,total,list}。
    鉴权：请求头 Authorization: Bearer <token>；白名单接口（/admin/login、/admin/register、/admin/info、/admin/logout）已标注 security: []。
    约定：CommonResult.data 的具体类型由各接口响应上的 x-data-type 标注；未对泛型逐个展开，以便文件可维护。
    注意：源码中部分删除类接口使用 GET（如 GET /brand/delete/{id}、GET /productAttribute/category/delete/{id}），已按源码如实登记。
  x-source-repo: mall
  x-source-ref: master
  x-source-commit: dcaa93b
servers:
  - url: http://localhost:8080
    description: 本地开发环境（mall-admin 默认端口）
security:
  - bearerAuth: []
tags:
  - { name: UmsAdminController, description: 后台用户管理 }
  - { name: UmsRoleController, description: 后台用户角色管理 }
  - { name: UmsMenuController, description: 后台菜单管理 }
  - { name: UmsResourceController, description: 后台资源管理 }
  - { name: UmsResourceCategoryController, description: 后台资源分类管理 }
  - { name: UmsMemberLevelController, description: 会员等级管理 }
  - { name: PmsBrandController, description: 商品品牌管理 }
  - { name: PmsProductController, description: 商品管理 }
  - { name: PmsProductCategoryController, description: 商品分类管理 }
  - { name: PmsProductAttributeController, description: 商品属性管理 }
  - { name: PmsProductAttributeCategoryController, description: 商品属性分类管理 }
  - { name: PmsSkuStockController, description: sku商品库存管理 }
  - { name: SmsCouponController, description: 优惠券管理 }
  - { name: SmsCouponHistoryController, description: 优惠券领取记录管理 }
  - { name: SmsFlashPromotionController, description: 限时购活动管理 }
  - { name: SmsFlashPromotionSessionController, description: 限时购场次管理 }
  - { name: SmsFlashPromotionProductRelationController, description: 限时购和商品关系管理 }
  - { name: SmsHomeAdvertiseController, description: 首页轮播广告管理 }
  - { name: SmsHomeBrandController, description: 首页品牌管理 }
  - { name: SmsHomeNewProductController, description: 首页新品管理 }
  - { name: SmsHomeRecommendProductController, description: 首页人气推荐管理 }
  - { name: SmsHomeRecommendSubjectController, description: 首页专题推荐管理 }
  - { name: OmsOrderController, description: 订单管理 }
  - { name: OmsOrderReturnApplyController, description: 订单退货申请管理 }
  - { name: OmsOrderReturnReasonController, description: 退货原因管理 }
  - { name: OmsOrderSettingController, description: 订单设置管理 }
  - { name: OmsCompanyAddressController, description: 收货地址管理 }
  - { name: CmsSubjectController, description: 商品专题管理 }
  - { name: CmsPrefrenceAreaController, description: 商品优选管理 }
  - { name: MinioController, description: MinIO对象存储管理 }
  - { name: OssController, description: Oss对象存储管理 }
paths:
  /admin/register:
    post:
      tags: [UmsAdminController]
      summary: 用户注册
      operationId: adminRegister
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsAdminParam' } } } }
      responses:
        '200': { description: 成功, x-data-type: UmsAdmin, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/login:
    post:
      tags: [UmsAdminController]
      summary: 登录以后返回token
      operationId: adminLogin
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsAdminLoginParam' } } } }
      responses:
        '200': { description: 成功返回 token 与 tokenHead；用户名或密码错误时 code=404 且 message 为 用户名或密码错误, x-data-type: Map(token,tokenHead), content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/refreshToken:
    get:
      tags: [UmsAdminController]
      summary: 刷新token
      operationId: adminRefreshToken
      responses:
        '200': { description: 成功返回新的 token 与 tokenHead；token 过期时返回失败, x-data-type: Map(token,tokenHead), content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/info:
    get:
      tags: [UmsAdminController]
      summary: 获取当前登录用户信息
      operationId: adminGetAdminInfo
      security: []
      responses:
        '200': { description: 成功；未登录返回 code=401, x-data-type: Map(username,menus,icon,roles), content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/logout:
    post:
      tags: [UmsAdminController]
      summary: 登出功能
      operationId: adminLogout
      security: []
      responses:
        '200': { description: 成功, x-data-type: 'null', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/list:
    get:
      tags: [UmsAdminController]
      summary: 根据用户名或姓名分页获取用户列表
      operationId: adminList
      parameters:
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200': { description: 成功, x-data-type: 'CommonPage<UmsAdmin>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/{id}:
    get:
      tags: [UmsAdminController]
      summary: 获取指定用户信息
      operationId: adminGetItem
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: UmsAdmin, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/update/{id}:
    post:
      tags: [UmsAdminController]
      summary: 修改指定用户信息
      operationId: adminUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsAdmin' } } } }
      responses:
        '200': { description: 成功返回受影响行数, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/updatePassword:
    post:
      tags: [UmsAdminController]
      summary: 修改指定用户密码
      operationId: adminUpdatePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAdminPasswordParam' } } } }
      responses:
        '200': { description: 成功返回状态码；-1 参数不合法、-2 找不到用户、-3 旧密码错误时返回失败, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/delete/{id}:
    post:
      tags: [UmsAdminController]
      summary: 删除指定用户信息
      operationId: adminDelete
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/updateStatus/{id}:
    post:
      tags: [UmsAdminController]
      summary: 修改帐号状态
      operationId: adminUpdateStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: status, in: query, required: true, schema: { type: integer, description: '帐号启用状态：0->禁用；1->启用' } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/role/update:
    post:
      tags: [UmsAdminController]
      summary: 给用户分配角色
      operationId: adminUpdateRole
      parameters:
        - { name: adminId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: roleIds, in: query, required: true, schema: { type: array, items: { type: integer, format: int64 } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /admin/role/{adminId}:
    get:
      tags: [UmsAdminController]
      summary: 获取指定用户的角色
      operationId: adminGetRoleList
      parameters: [ { name: adminId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsRole>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/create:
    post:
      tags: [UmsRoleController]
      summary: 添加角色
      operationId: roleCreate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsRole' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/update/{id}:
    post:
      tags: [UmsRoleController]
      summary: 修改角色
      operationId: roleUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsRole' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/delete:
    post:
      tags: [UmsRoleController]
      summary: 批量删除角色
      operationId: roleDelete
      parameters: [ $ref: '#/components/parameters/Ids' ]
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/listAll:
    get:
      tags: [UmsRoleController]
      summary: 获取所有角色
      operationId: roleListAll
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsRole>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/list:
    get:
      tags: [UmsRoleController]
      summary: 根据角色名称分页获取角色列表
      operationId: roleList
      parameters:
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200': { description: 成功, x-data-type: 'CommonPage<UmsRole>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/updateStatus/{id}:
    post:
      tags: [UmsRoleController]
      summary: 修改角色状态
      operationId: roleUpdateStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: status, in: query, required: true, schema: { type: integer, description: '启用状态：0->禁用；1->启用' } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/listMenu/{roleId}:
    get:
      tags: [UmsRoleController]
      summary: 获取角色相关菜单
      operationId: roleListMenu
      parameters: [ { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsMenu>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/listResource/{roleId}:
    get:
      tags: [UmsRoleController]
      summary: 获取角色相关资源
      operationId: roleListResource
      parameters: [ { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsResource>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/allocMenu:
    post:
      tags: [UmsRoleController]
      summary: 给角色分配菜单
      operationId: roleAllocMenu
      parameters:
        - { name: roleId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: menuIds, in: query, required: true, schema: { type: array, items: { type: integer, format: int64 } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /role/allocResource:
    post:
      tags: [UmsRoleController]
      summary: 给角色分配资源
      operationId: roleAllocResource
      parameters:
        - { name: roleId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: resourceIds, in: query, required: true, schema: { type: array, items: { type: integer, format: int64 } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/create:
    post:
      tags: [UmsMenuController]
      summary: 添加后台菜单
      operationId: menuCreate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsMenu' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/update/{id}:
    post:
      tags: [UmsMenuController]
      summary: 修改后台菜单
      operationId: menuUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsMenu' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/{id}:
    get:
      tags: [UmsMenuController]
      summary: 根据ID获取菜单详情
      operationId: menuGetItem
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: UmsMenu, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/delete/{id}:
    post:
      tags: [UmsMenuController]
      summary: 根据ID删除后台菜单
      operationId: menuDelete
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/list/{parentId}:
    get:
      tags: [UmsMenuController]
      summary: 分页查询后台菜单
      operationId: menuList
      parameters:
        - { name: parentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200': { description: 成功, x-data-type: 'CommonPage<UmsMenu>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/treeList:
    get:
      tags: [UmsMenuController]
      summary: 树形结构返回所有菜单列表
      operationId: menuTreeList
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsMenuNode>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /menu/updateHidden/{id}:
    post:
      tags: [UmsMenuController]
      summary: 修改菜单显示状态
      operationId: menuUpdateHidden
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: hidden, in: query, required: true, schema: { type: integer, description: '前端隐藏：0->显示；1->隐藏' } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/create:
    post:
      tags: [UmsResourceController]
      summary: 添加后台资源
      operationId: resourceCreate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsResource' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/update/{id}:
    post:
      tags: [UmsResourceController]
      summary: 修改后台资源
      operationId: resourceUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsResource' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/{id}:
    get:
      tags: [UmsResourceController]
      summary: 根据ID获取资源详情
      operationId: resourceGetItem
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: UmsResource, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/delete/{id}:
    post:
      tags: [UmsResourceController]
      summary: 根据ID删除后台资源
      operationId: resourceDelete
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/list:
    get:
      tags: [UmsResourceController]
      summary: 分页模糊查询后台资源
      operationId: resourceList
      parameters:
        - { name: categoryId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: nameKeyword, in: query, required: false, schema: { type: string } }
        - { name: urlKeyword, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200': { description: 成功, x-data-type: 'CommonPage<UmsResource>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resource/listAll:
    get:
      tags: [UmsResourceController]
      summary: 查询所有后台资源
      operationId: resourceListAll
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsResource>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resourceCategory/listAll:
    get:
      tags: [UmsResourceCategoryController]
      summary: 查询所有后台资源分类
      operationId: resourceCategoryListAll
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsResourceCategory>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resourceCategory/create:
    post:
      tags: [UmsResourceCategoryController]
      summary: 添加后台资源分类
      operationId: resourceCategoryCreate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsResourceCategory' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resourceCategory/update/{id}:
    post:
      tags: [UmsResourceCategoryController]
      summary: 修改后台资源分类
      operationId: resourceCategoryUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UmsResourceCategory' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /resourceCategory/delete/{id}:
    post:
      tags: [UmsResourceCategoryController]
      summary: 根据ID删除后台资源分类
      operationId: resourceCategoryDelete
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /memberLevel/list:
    get:
      tags: [UmsMemberLevelController]
      summary: 查询所有会员等级
      operationId: memberLevelList
      parameters:
        - { name: defaultStatus, in: query, required: true, schema: { type: integer, description: '是否为默认等级：0->不是；1->是' } }
      responses:
        '200': { description: 成功, x-data-type: 'List<UmsMemberLevel>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /brand/listAll:
    get:
      tags: [PmsBrandController]
      summary: 获取全部品牌列表
      operationId: brandListAll
      responses:
        '200': { description: 成功, x-data-type: 'List<PmsBrand>', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /brand/create:
    post:
      tags: [PmsBrandController]
      summary: 添加品牌
      operationId: brandCreate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PmsBrandParam' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /brand/update/{id}:
    post:
      tags: [PmsBrandController]
      summary: 更新品牌
      operationId: brandUpdate
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PmsBrandParam' } } } }
      responses:
        '200': { description: 成功, x-data-type: integer, content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /brand/delete/{id}:
    get:
      tags: [PmsBrandController]
      summary: 删除品牌（源码使用 GET）
      operationId: brandDelete
      parameters: [ $ref: '#/components/parameters/IdPath' ]
      responses:
        '200': { description: 成功, x-data-type: 'null', content: { application/json: { schema: { $ref: '#/components/schemas/CommonResult' } } } }
  /brand/list:
    get:
      tags: [PmsBrandController]
      summary: 根据品牌名称分页获取品牌列表
      operationId: brandList

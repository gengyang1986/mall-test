openapi: 3.0.3
info:
  title: mall-admin 核心接口
  version: 0.1.0
  description: |
    由 AITestApp 依据代码仓 mall（master, dcaa93b）真实源码生成，覆盖 mall-admin 核心 6 个 Controller：
    UmsAdminController、UmsRoleController、UmsMenuController、PmsBrandController、PmsProductController、OmsOrderController。

    说明（与源码一致，务必注意）：
    1. 所有接口 HTTP 状态码均为 200，业务结果放在响应体 code 字段：200=操作成功、500=操作失败、404=参数检验失败、401=暂未登录或token已过期、403=没有相关权限（见 mall-common ResultCode）。
    2. 统一响应体为 CommonResult{code,message,data}；分页数据为 CommonPage{pageNum,pageSize,totalPage,total,list}。
    3. 鉴权：除 /admin/login、/admin/register、/admin/info、/admin/logout（application.yml secure.ignored.urls 白名单）外，其余接口需在 Authorization 头携带 "Bearer " + token。
    4. 路径前缀即 Controller 上的 @RequestMapping，未包含网关/前端代理前缀。
    5. 本次为第一阶段（admin 核心）：PmsProductParam/PmsProductResult/OmsOrderDetail 内嵌的子模型集合（skuStockList、productLadderList、orderItemList 等）暂以 object 占位，字段将在第二阶段展开。
    6. 遗留问题：OmsOrderController 中 /order/update/receiverInfo 与 /order/update/moneyInfo 两个方法同名（updateReceiverInfo），Java 可编译但可读性差，建议在测试用例中分别覆盖，避免混淆。
servers:
  - url: http://localhost:8080
    description: mall-admin 本地 dev（spring.application.name=mall-admin）
security:
  - bearerAuth: []
tags:
  - name: UmsAdminController
    description: 后台用户管理（/admin）
  - name: UmsRoleController
    description: 后台用户角色管理（/role）
  - name: UmsMenuController
    description: 后台菜单管理（/menu）
  - name: PmsBrandController
    description: 商品品牌管理（/brand）
  - name: PmsProductController
    description: 商品管理（/product）
  - name: OmsOrderController
    description: 订单管理（/order）
paths:
  /admin/register:
    post:
      tags: [UmsAdminController]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsAdminParam'}
      responses:
        '200':
          description: CommonResult<UmsAdmin>；注册失败返回 code=500
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsAdmin'}
  /admin/login:
    post:
      tags: [UmsAdminController]
      summary: 登录以后返回token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsAdminLoginParam'}
      responses:
        '200':
          description: 成功 data={token,tokenHead}；用户名或密码错误返回 code=404（validateFailed）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultToken'}
  /admin/refreshToken:
    get:
      tags: [UmsAdminController]
      summary: 刷新token
      description: 从请求头 Authorization 取旧 token 换取新 token；token 已过期返回 code=500，message="token已经过期！"
      responses:
        '200':
          description: CommonResultToken；失败 code=500
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultToken'}
  /admin/info:
    get:
      tags: [UmsAdminController]
      summary: 获取当前登录用户信息
      security: []
      description: principal 为空时返回 code=401（unauthorized）。白名单放行但业务仍依赖登录态。
      responses:
        '200':
          description: CommonResult<AdminInfo>；未登录 code=401
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultAdminInfo'}
  /admin/logout:
    post:
      tags: [UmsAdminController]
      summary: 登出功能
      responses:
        '200':
          description: CommonResult，data 固定为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /admin/list:
    get:
      tags: [UmsAdminController]
      summary: 根据用户名或姓名分页获取用户列表
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
          description: 用户名/姓名关键词
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200':
          description: CommonResult<CommonPage<UmsAdmin>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsAdmin'}
  '/admin/{id}':
    get:
      tags: [UmsAdminController]
      summary: 获取指定用户信息
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<UmsAdmin>；用户不存在时 data 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsAdmin'}
  '/admin/update/{id}':
    post:
      tags: [UmsAdminController]
      summary: 修改指定用户信息
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsAdmin'}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数；失败 code=500
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /admin/updatePassword:
    post:
      tags: [UmsAdminController]
      summary: 修改指定用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAdminPasswordParam'}
      responses:
        '200':
          description: |
            CommonResult；失败 message 区分：提交参数不合法 / 找不到该用户 / 旧密码错误（均为 code=500）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/admin/delete/{id}':
    post:
      tags: [UmsAdminController]
      summary: 删除指定用户信息
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，成功 data=删除条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/admin/updateStatus/{id}':
    post:
      tags: [UmsAdminController]
      summary: 修改帐号状态
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: status
          in: query
          required: true
          schema: {type: integer, enum: [0, 1]}
          description: 帐号启用状态：0->禁用；1->启用
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /admin/role/update:
    post:
      tags: [UmsAdminController]
      summary: 给用户分配角色
      parameters:
        - name: adminId
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: roleIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，count>=0 即返回成功（含清空角色的 0 条场景）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/admin/role/{adminId}':
    get:
      tags: [UmsAdminController]
      summary: 获取指定用户的角色
      parameters:
        - name: adminId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<List<UmsRole>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsRoleList'}
  /role/create:
    post:
      tags: [UmsRoleController]
      summary: 添加角色
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsRole'}
      responses:
        '200':
          description: CommonResult，成功 data=创建条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/role/update/{id}':
    post:
      tags: [UmsRoleController]
      summary: 修改角色
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsRole'}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /role/delete:
    post:
      tags: [UmsRoleController]
      summary: 批量删除角色
      parameters:
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: CommonResult，成功 data=删除条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /role/listAll:
    get:
      tags: [UmsRoleController]
      summary: 获取所有角色
      responses:
        '200':
          description: CommonResult<List<UmsRole>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsRoleList'}
  /role/list:
    get:
      tags: [UmsRoleController]
      summary: 根据角色名称分页获取角色列表
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200':
          description: CommonResult<CommonPage<UmsRole>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsRole'}
  '/role/updateStatus/{id}':
    post:
      tags: [UmsRoleController]
      summary: 修改角色状态
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: status
          in: query
          required: true
          schema: {type: integer, enum: [0, 1]}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/role/listMenu/{roleId}':
    get:
      tags: [UmsRoleController]
      summary: 获取角色相关菜单
      parameters:
        - name: roleId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<List<UmsMenu>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsMenuList'}
  '/role/listResource/{roleId}':
    get:
      tags: [UmsRoleController]
      summary: 获取角色相关资源
      parameters:
        - name: roleId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<List<UmsResource>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsResourceList'}
  /role/allocMenu:
    post:
      tags: [UmsRoleController]
      summary: 给角色分配菜单
      parameters:
        - name: roleId
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: menuIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，恒返回成功（无失败分支）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /role/allocResource:
    post:
      tags: [UmsRoleController]
      summary: 给角色分配资源
      parameters:
        - name: roleId
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: resourceIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，恒返回成功（无失败分支）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /menu/create:
    post:
      tags: [UmsMenuController]
      summary: 添加后台菜单
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsMenu'}
      responses:
        '200':
          description: CommonResult，成功 data=创建条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/menu/update/{id}':
    post:
      tags: [UmsMenuController]
      summary: 修改后台菜单
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmsMenu'}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/menu/{id}':
    get:
      tags: [UmsMenuController]
      summary: 根据ID获取菜单详情
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<UmsMenu>；不存在时 data 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsMenu'}
  '/menu/delete/{id}':
    post:
      tags: [UmsMenuController]
      summary: 根据ID删除后台菜单
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，成功 data=删除条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/menu/list/{parentId}':
    get:
      tags: [UmsMenuController]
      summary: 分页查询后台菜单
      parameters:
        - name: parentId
          in: path
          required: true
          schema: {type: integer, format: int64}
          description: 父级ID，顶级传 0
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200':
          description: CommonResult<CommonPage<UmsMenu>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsMenu'}
  /menu/treeList:
    get:
      tags: [UmsMenuController]
      summary: 树形结构返回所有菜单列表
      responses:
        '200':
          description: CommonResult<List<UmsMenuNode>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultUmsMenuNodeList'}
  '/menu/updateHidden/{id}':
    post:
      tags: [UmsMenuController]
      summary: 修改菜单显示状态
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: hidden
          in: query
          required: true
          schema: {type: integer, enum: [0, 1]}
          description: 0->显示；1->隐藏
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /brand/listAll:
    get:
      tags: [PmsBrandController]
      summary: 获取全部品牌列表
      responses:
        '200':
          description: CommonResult<List<PmsBrand>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultPmsBrandList'}
  /brand/create:
    post:
      tags: [PmsBrandController]
      summary: 添加品牌
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PmsBrandParam'}
      responses:
        '200':
          description: CommonResult；仅 count==1 视为成功，否则 code=500
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/brand/update/{id}':
    post:
      tags: [PmsBrandController]
      summary: 更新品牌
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PmsBrandParam'}
      responses:
        '200':
          description: CommonResult；仅 count==1 视为成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/brand/delete/{id}':
    get:
      tags: [PmsBrandController]
      summary: 删除品牌（注意是 GET）
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult，成功 data=null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /brand/list:
    get:
      tags: [PmsBrandController]
      summary: 根据品牌名称分页获取品牌列表
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
        - name: showStatus
          in: query
          required: false
          schema: {type: integer, enum: [0, 1]}
          description: 显示状态：0->不显示；1->显示
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: CommonResult<CommonPage<PmsBrand>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultCommonPagePmsBrand'}
  '/brand/{id}':
    get:
      tags: [PmsBrandController]
      summary: 根据编号查询品牌信息
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<PmsBrand>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultPmsBrand'}
  /brand/delete/batch:
    post:
      tags: [PmsBrandController]
      summary: 批量删除品牌
      parameters:
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: CommonResult，成功 data=删除条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /brand/update/showStatus:
    post:
      tags: [PmsBrandController]
      summary: 批量更新显示状态
      parameters:
        - $ref: '#/components/parameters/Ids'
        - name: showStatus
          in: query
          required: true
          schema: {type: integer, enum: [0, 1]}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /brand/update/factoryStatus:
    post:
      tags: [PmsBrandController]
      summary: 批量更新厂家制造商状态
      parameters:
        - $ref: '#/components/parameters/Ids'
        - name: factoryStatus
          in: query
          required: true
          schema: {type: integer, enum: [0, 1]}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /product/create:
    post:
      tags: [PmsProductController]
      summary: 创建商品
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PmsProductParam'}
      responses:
        '200':
          description: CommonResult，成功 data=创建条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  '/product/updateInfo/{id}':
    get:
      tags: [PmsProductController]
      summary: 根据商品id获取商品编辑信息
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: CommonResult<PmsProductResult>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultPmsProductResult'}
  '/product/update/{id}':
    post:
      tags: [PmsProductController]
      summary: 更新商品
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PmsProductParam'}
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /product/list:
    get:
      tags: [PmsProductController]
      summary: 查询商品
      description: 查询条件由 PmsProductQueryParam 以 query 形式绑定（非 @RequestBody）
      parameters:
        - name: publishStatus
          in: query
          required: false
          schema: {type: integer, enum: [0, 1]}
          description: 上架状态：0->下架；1->上架
        - name: verifyStatus
          in: query
          required: false
          schema: {type: integer, enum: [0, 1]}
          description: 审核状态：0->未审核；1->审核通过
        - name: keyword
          in: query
          required: false
          schema: {type: string}
          description: 商品名称模糊关键字
        - name: productSn
          in: query
          required: false
          schema: {type: string}
        - name: productCategoryId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: brandId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNum'
      responses:
        '200':
          description: CommonResult<CommonPage<PmsProduct>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultCommonPagePmsProduct'}
  /product/simpleList:
    get:
      tags: [PmsProductController]
      summary: 根据商品名称或货号模糊查询
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: CommonResult<List<PmsProduct>>
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResultPmsProductList'}
  /product/update/verifyStatus:
    post:
      tags: [PmsProductController]
      summary: 批量修改审核状态
      parameters:
        - $ref: '#/components/parameters/Ids'

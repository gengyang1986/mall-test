        - name: orderSn
          in: query
          required: false
          schema: {type: string}
          description: 订单编号
        - name: receiverKeyword
          in: query
          required: false
          schema: {type: string}
          description: 收货人姓名/号码
        - name: status
          in: query
          required: false
          schema: {type: integer, enum: [0, 1, 2, 3, 4, 5]}
          description: 0->待付款；1->待发货；2->已发货；3->已完成；4->已关闭；5->无效订单
        - name: orderType
          in: query
          required: false
          schema: {type: integer, enum: [0, 1]}
        - name: sourceType
          in: query
          required: false
          schema: {type: integer, enum: [0, 1]}
        - name: createTime
          in: query
          required: false
          schema: {type: string}

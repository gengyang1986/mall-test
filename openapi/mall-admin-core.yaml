        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
  /order/update/note:
    post:
      tags: [OmsOrderController]
      summary: 备注订单
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: note
          in: query
          required: true
          schema: {type: string}
        - name: status
          in: query
          required: true
          schema: {type: integer}
          description: 订单状态：0->待付款；1->待发货；2->已发货；3->已完成；4->已关闭；5->无效订单
      responses:
        '200':
          description: CommonResult，成功 data=更新条数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommonResult'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 请求头 Authorization Bearer {token}（jwt.tokenHeader=Authorization，jwt.tokenHead='Bearer '）
  parameters:
    PageNum:
      name: pageNum
      in: query
      required: false
      schema: {type: integer, default: 1, minimum: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, default: 5, minimum: 1}
    Ids:
      name: ids
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        items: {type: integer, format: int64}
      description: 主键ID集合，形如 ids=1&ids=2
  schemas:
    CommonResult:
      type: object
      description: 通用返回结果（mall-common CommonResult<T>），HTTP 状态恒为 200
      properties:
        code:
          type: integer
          format: int64
          description: 200 操作成功 / 500 操作失败 / 404 参数检验失败 / 401 暂未登录或token已过期 / 403 没有相关权限
          example: 200
        message:
          type: string
          example: 操作成功
        data:
          type: object
          nullable: true
          description: 业务数据，失败时为 null
    CommonPage:
      type: object
      description: 通用分页封装（mall-common CommonPage<T>）
      properties:
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 5
        totalPage:
          type: integer
          example: 3
        total:
          type: integer
          format: int64
          example: 15
        list:
          type: array
          items:
            type: object
    UmsAdminParam:
      type: object
      description: 用户注册参数（UmsAdminParam）
      required: [username, password]
      properties:
        username: {type: string, description: 用户名}
        password: {type: string, description: 密码}
        icon: {type: string, description: 用户头像}
        email: {type: string, format: email, description: 邮箱（@Email 校验）}
        nickName: {type: string, description: 用户昵称}
        note: {type: string, description: 备注}
    UmsAdminLoginParam:
      type: object
      description: 用户登录参数（UmsAdminLoginParam）
      required: [username, password]
      properties:
        username: {type: string, description: 用户名}
        password: {type: string, description: 密码}
    UpdateAdminPasswordParam:
      type: object
      description: 修改用户密码参数（UpdateAdminPasswordParam）
      required: [username, oldPassword, newPassword]
      properties:
        username: {type: string, description: 用户名}
        oldPassword: {type: string, description: 旧密码}
        newPassword: {type: string, description: 新密码}
    UmsAdmin:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        password: {type: string}
        icon: {type: string, description: 头像}
        email: {type: string, description: 邮箱}
        nickName: {type: string, description: 昵称}
        note: {type: string, description: 备注信息}
        createTime: {type: string, format: date-time, description: 创建时间}
        loginTime: {type: string, format: date-time, description: 最后登录时间}
        status: {type: integer, enum: [0, 1], description: 帐号启用状态：0->禁用；1->启用}
    UmsRole:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string, description: 名称}
        description: {type: string, description: 描述}
        adminCount: {type: integer, description: 后台用户数量}
        createTime: {type: string, format: date-time, description: 创建时间}
        status: {type: integer, enum: [0, 1], description: 启用状态：0->禁用；1->启用}
        sort: {type: integer}
    UmsMenu:
      type: object
      properties:
        id: {type: integer, format: int64}
        parentId: {type: integer, format: int64, description: 父级ID}
        createTime: {type: string, format: date-time, description: 创建时间}
        title: {type: string, description: 菜单名称}
        level: {type: integer, description: 菜单级数}
        sort: {type: integer, description: 菜单排序}
        name: {type: string, description: 前端名称}
        icon: {type: string, description: 前端图标}
        hidden: {type: integer, enum: [0, 1], description: 前端隐藏}
    UmsMenuNode:
      allOf:
        - $ref: '#/components/schemas/UmsMenu'
        - type: object
          properties:
            children:
              type: array
              description: 子级菜单
              items: {$ref: '#/components/schemas/UmsMenuNode'}
    UmsResource:
      type: object
      properties:
        id: {type: integer, format: int64}
        createTime: {type: string, format: date-time, description: 创建时间}
        name: {type: string, description: 资源名称}
        url: {type: string, description: 资源URL}
        description: {type: string, description: 描述}
        categoryId: {type: integer, format: int64, description: 资源分类ID}
    PmsBrand:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        firstLetter: {type: string, description: 首字母}
        sort: {type: integer}
        factoryStatus: {type: integer, enum: [0, 1], description: 是否为品牌制造商：0->不是；1->是}
        showStatus: {type: integer, enum: [0, 1], description: 显示状态}
        productCount: {type: integer, description: 产品数量}
        productCommentCount: {type: integer, description: 产品评论数量}
        logo: {type: string, description: 品牌logo}
        bigPic: {type: string, description: 专区大图}
        brandStory: {type: string, description: 品牌故事}
    PmsBrandParam:
      type: object
      description: 品牌请求参数（PmsBrandParam）
      required: [name, logo]
      properties:
        name: {type: string, description: 品牌名称}
        firstLetter: {type: string, description: 品牌首字母}
        sort: {type: integer, minimum: 0, description: 排序字段（@Min(0)）}
        factoryStatus: {type: integer, enum: [0, 1], description: 是否为厂家制造商（FlagValidator 仅允许 0/1）}
        showStatus: {type: integer, enum: [0, 1], description: 是否进行显示（FlagValidator 仅允许 0/1）}
        logo: {type: string, description: 品牌logo}
        bigPic: {type: string, description: 品牌大图}
        brandStory: {type: string, description: 品牌故事}
    PmsProduct:
      type: object
      description: 商品（PmsProduct，字段取自 mall-mbg 模型；detailDesc/detailHtml 等详情字段以源码为准）
      properties:
        id: {type: integer, format: int64}
        brandId: {type: integer, format: int64}
        productCategoryId: {type: integer, format: int64}
        feightTemplateId: {type: integer, format: int64, description: 运费模板ID}
        productAttributeCategoryId: {type: integer, format: int64}
        name: {type: string}
        pic: {type: string}
        productSn: {type: string, description: 货号}
        deleteStatus: {type: integer, enum: [0, 1], description: 删除状态：0->未删除；1->已删除}
        publishStatus: {type: integer, enum: [0, 1], description: 上架状态：0->下架；1->上架}
        newStatus: {type: integer, enum: [0, 1], description: 新品状态：0->不是新品；1->新品}
        recommandStatus: {type: integer, enum: [0, 1], description: 推荐状态：0->不推荐；1->推荐}
        verifyStatus: {type: integer, enum: [0, 1], description: 审核状态：0->未审核；1->审核通过}
        sort: {type: integer, description: 排序}
        sale: {type: integer, description: 销量}
        price: {type: number, format: bigdecimal}
        promotionPrice: {type: number, format: bigdecimal, description: 促销价格}
        giftGrowth: {type: integer, description: 赠送的成长值}
        giftPoint: {type: integer, description: 赠送的积分}
        usePointLimit: {type: integer, description: 限制使用的积分数}
        subTitle: {type: string, description: 副标题}
        originalPrice: {type: number, format: bigdecimal, description: 市场价}
        stock: {type: integer, description: 库存}
        lowStock: {type: integer, description: 库存预警值}
        unit: {type: string, description: 单位}
        weight: {type: number, format: bigdecimal, description: 商品重量，默认为克}
        previewStatus: {type: integer, enum: [0, 1], description: 是否为预告商品：0->不是；1->是}
        serviceIds: {type: string, description: 以逗号分割的产品服务：1->无忧退货；2->快速退款；3->免费包邮}
        keywords: {type: string}
        note: {type: string}
        albumPics: {type: string, description: 画册图片，连产品图片限制为5张，以逗号分割}
        detailTitle: {type: string}
    PmsProductParam:
      description: 创建/修改商品请求参数（PmsProductParam extends PmsProduct）
      allOf:
        - $ref: '#/components/schemas/PmsProduct'
        - type: object
          properties:
            productLadderList:
              type: array
              description: 商品阶梯价格设置（PmsProductLadder，字段待展开）
              items: {type: object}
            productFullReductionList:
              type: array
              description: 商品满减价格设置（PmsProductFullReduction，字段待展开）
              items: {type: object}
            memberPriceList:
              type: array
              description: 商品会员价格设置（PmsMemberPrice，字段待展开）
              items: {type: object}
            skuStockList:
              type: array
              description: 商品sku库存信息（PmsSkuStock，字段待展开）
              items: {type: object}
            productAttributeValueList:
              type: array
              description: 商品参数及自定义规格属性（PmsProductAttributeValue，字段待展开）
              items: {type: object}
            subjectProductRelationList:
              type: array
              description: 专题和商品关系（CmsSubjectProductRelation，字段待展开）
              items: {type: object}
            prefrenceAreaProductRelationList:
              type: array
              description: 优选专区和商品关系（CmsPrefrenceAreaProductRelation，字段待展开）
              items: {type: object}
    PmsProductResult:
      description: 商品编辑信息（PmsProductResult extends PmsProductParam）
      allOf:
        - $ref: '#/components/schemas/PmsProductParam'
        - type: object
          properties:
            cateParentId: {type: integer, format: int64, description: 商品所选分类的父id}
    OmsOrder:
      type: object
      properties:
        id: {type: integer, format: int64, description: 订单id}
        memberId: {type: integer, format: int64}
        couponId: {type: integer, format: int64}
        orderSn: {type: string, description: 订单编号}
        createTime: {type: string, format: date-time, description: 提交时间}
        memberUsername: {type: string, description: 用户帐号}
        totalAmount: {type: number, format: bigdecimal, description: 订单总金额}
        payAmount: {type: number, format: bigdecimal, description: 应付金额（实际支付金额）}
        freightAmount: {type: number, format: bigdecimal, description: 运费金额}
        promotionAmount: {type: number, format: bigdecimal, description: 促销优化金额}
        integrationAmount: {type: number, format: bigdecimal, description: 积分抵扣金额}
        couponAmount: {type: number, format: bigdecimal, description: 优惠券抵扣金额}
        discountAmount: {type: number, format: bigdecimal, description: 管理员后台调整订单使用的折扣金额}
        payType: {type: integer, enum: [0, 1, 2], description: 支付方式：0->未支付；1->支付宝；2->微信}
        sourceType: {type: integer, enum: [0, 1], description: 订单来源：0->PC订单；1->app订单}
        status: {type: integer, enum: [0, 1, 2, 3, 4, 5], description: 订单状态：0->待付款；1->待发货；2->已发货；3->已完成；4->已关闭；5->无效订单}
        orderType: {type: integer, enum: [0, 1], description: 订单类型：0->正常订单；1->秒杀订单}
        deliveryCompany: {type: string, description: 物流公司（配送方式）}
        deliverySn: {type: string, description: 物流单号}
        autoConfirmDay: {type: integer, description: 自动确认时间（天）}
        integration: {type: integer, description: 可以获得的积分}
        growth: {type: integer, description: 可以活动的成长值}
        promotionInfo: {type: string, description: 活动信息}
        billType: {type: integer, enum: [0, 1, 2], description: 发票类型：0->不开发票；1->电子发票；2->纸质发票}
        billHeader: {type: string, description: 发票抬头}
        billContent: {type: string, description: 发票内容}
        billReceiverPhone: {type: string, description: 收票人电话}
        billReceiverEmail: {type: string, description: 收票人邮箱}
        receiverName: {type: string, description: 收货人姓名}
        receiverPhone: {type: string, description: 收货人电话}
        receiverPostCode: {type: string, description: 收货人邮编}
        receiverProvince: {type: string, description: 省份/直辖市}
        receiverCity: {type: string, description: 城市}
        receiverRegion: {type: string, description: 区}
        receiverDetailAddress: {type: string, description: 详细地址}
        note: {type: string, description: 订单备注}
        confirmStatus: {type: integer, enum: [0, 1], description: 确认收货状态：0->未确认；1->已确认}
        deleteStatus: {type: integer, enum: [0, 1], description: 删除状态：0->未删除；1->已删除}
        useIntegration: {type: integer, description: 下单时使用的积分}
        paymentTime: {type: string, format: date-time, description: 支付时间}
        deliveryTime: {type: string, format: date-time, description: 发货时间}
        receiveTime: {type: string, format: date-time, description: 确认收货时间}
        commentTime: {type: string, format: date-time, description: 评价时间}
        modifyTime: {type: string, format: date-time, description: 修改时间}
    OmsOrderDetail:
      description: 订单详情（OmsOrderDetail extends OmsOrder）
      allOf:
        - $ref: '#/components/schemas/OmsOrder'
        - type: object
          properties:
            orderItemList:
              type: array
              description: 订单商品列表（OmsOrderItem，字段待展开）
              items: {type: object}
            historyList:
              type: array
              description: 订单操作记录列表（OmsOrderOperateHistory，字段待展开）
              items: {type: object}
    OmsOrderDeliveryParam:
      type: object
      description: 订单发货参数（OmsOrderDeliveryParam）
      properties:
        orderId: {type: integer, format: int64, description: 订单id}
        deliveryCompany: {type: string, description: 物流公司}
        deliverySn: {type: string, description: 物流单号}
    OmsReceiverInfoParam:
      type: object
      description: 修改收货人信息参数（OmsReceiverInfoParam）
      properties:
        orderId: {type: integer, format: int64, description: 订单ID}
        receiverName: {type: string, description: 收货人姓名}
        receiverPhone: {type: string, description: 收货人电话}
        receiverPostCode: {type: string, description: 收货人邮编}
        receiverDetailAddress: {type: string, description: 详细地址}
        receiverProvince: {type: string, description: 省份/直辖市}
        receiverCity: {type: string, description: 城市}
        receiverRegion: {type: string, description: 区}
        status: {type: integer, description: 订单状态：0->待付款；1->待发货；2->已发货；3->已完成；4->已关闭；5->无效订单}
    OmsMoneyInfoParam:
      type: object
